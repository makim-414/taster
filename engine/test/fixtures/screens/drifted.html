<style>.button { border-radius: 4px; } .badge { background: #ff00aa; }</style>
</head>
<body>
  <header>
    <a href="home.html">Field Notes</a>
    <nav aria-label="Main"><a href="pricing.html">Pricing</a><a href="home.html#notes">Notes</a></nav>
  </header>
  <main>
    <section>
      <h1>One price per writer</h1>
      <p>Pay for the people who write, not for the notes they keep.</p>
    </section>
    <section>
      <h2>Plans</h2>
      <div class="cards">
        <div class="card"><h3>Solo</h3><p>One writer, every feature.</p><span class="badge">Monthly</span><a class="button" href="home.html">Choose Solo</a></div>
        <div class="card"><h3>Team</h3><p>Up to ten writers who share places.</p><span class="badge">Monthly</span><a class="button" href="home.html">Choose Team</a></div>
      </div>
    </section>
  </main>
