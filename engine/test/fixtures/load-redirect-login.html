<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  form { width: 22rem; padding: 2rem; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, .08); }
  .eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .2em; color: #52525b; }
  label { display: block; margin-top: 1rem; }
  input { display: block; width: 100%; box-sizing: border-box; padding: .5rem; }
</style>
</head>
<body>
<!-- The sign-in page another host answers with after a redirect. engine/test/blocked.test.mjs sends
     a request for a page on 127.0.0.1 here, on localhost, with HTTP 302. -->
<form method="post" action="/session">
  <p class="eyebrow">Account</p>
  <h1>Sign in</h1>
  <label>Email <input type="email" name="email" autocomplete="username"></label>
  <label>Password <input type="password" name="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
