<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch week: loud fixture</title>
<!-- Fixture for engine/test/system.test.mjs. Every dial pushed to its extreme at once: poster type, many hues,
     layered shadows, pillow radius, heavy borders and animation. The measured setting breaks several constraints,
     so the system has to balance it. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0f; color: #ffffff; font-family: 'Clash Display', sans-serif; font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 64px 40px; }
  h1 { font-size: 84px; font-weight: 800; line-height: 1; }
  .lead { margin-top: 24px; font-size: 15px; color: #c4c4cc; }
  .actions { display: flex; gap: 28px; margin-top: 40px; }
  .btn { display: inline-block; padding: 14px 28px; line-height: 24px; border-radius: 16px; background: #db2777; color: #ffffff; text-decoration: none; transition: transform 400ms ease; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 64px; }
  .card { padding: 32px; border-radius: 24px; border: 2px solid #ffffff; box-shadow: 0 8px 16px rgba(0,0,0,.5), 0 24px 48px rgba(0,0,0,.5); animation: float 3s ease-in-out infinite alternate; }
  .card.a { background: #7c3aed; }
  .card.b { background: #0891b2; }
  .card.c { background: #ca8a04; }
  .card h2 { font-size: 22px; font-weight: 700; }
  .card p { margin-top: 8px; color: #ffffff; }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Launch week is here</h1>
    <p class="lead">Five days of new things for everyone who makes things.</p>
    <div class="actions"><a class="btn" href="#">Join now</a><a class="btn" href="#">See the schedule</a></div>
    <section class="grid">
      <div class="card a"><h2>Day one</h2><p>Faster builds for every project.</p></div>
      <div class="card b"><h2>Day two</h2><p>Sharing that keeps everyone in sync.</p></div>
      <div class="card c"><h2>Day three</h2><p>New ways to ship on time.</p></div>
    </section>
  </div>
</body>
</html>
