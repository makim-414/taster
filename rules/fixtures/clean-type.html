<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type sample</title>
<style>
/* Tight tracking where it belongs: a wordmark drawn that way and a headline set only a little tight. */
@font-face { font-family: "Fixture Sans"; src: local("Helvetica Neue"), local("Arial"), local("Helvetica"), local("DejaVu Sans"); }
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: "Fixture Sans", sans-serif; font-size: 17px; line-height: 1.6; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #d9d9d6; }
header a { color: #1a1a1a; text-decoration: none; }
.brand { font-size: 36px; font-weight: 700; letter-spacing: -0.06em; }
nav a { display: inline-flex; align-items: center; min-height: 44px; margin-left: 20px; font-size: 15px; }
main { max-width: 880px; margin: 0 auto; padding: 72px 24px; }
h1 { font-size: 48px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 20px; }
p { margin: 0 0 16px; max-width: 36em; color: #55575a; }
footer { padding: 40px 24px; border-top: 1px solid #d9d9d6; }
.footer-logo { font-size: 40px; font-weight: 700; letter-spacing: -0.05em; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Flow</a>
  <nav><a href="#">Docs</a><a href="#">Pricing</a></nav>
</header>
<main>
  <h1>Plan the week in one place</h1>
  <p>Write the plan, share it with the team and keep the notes next to the work they describe.</p>
</main>
<footer>
  <div class="footer-logo">Flow</div>
  <p>Questions go to the support desk.</p>
</footer>
</body>
</html>
