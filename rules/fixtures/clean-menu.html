<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Clean menu fixture</title>
<style>
  body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; color: #1a1a1a; background: #fbfaf8; font-size: 16px; line-height: 1.7; word-break: keep-all; }
  h1 { font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif; font-size: 40px; margin: 24px 48px; }
  /* Tall one-word menu items: a tall box is not a wrapped line. */
  .menu { display: flex; gap: 4px; padding: 0 16px; }
  .menu a { display: flex; align-items: center; height: 64px; padding: 0 8px; line-height: 1.2; font-size: 15px; color: #1a1a1a; text-decoration: none; word-break: normal; }
  .menu a.just { text-align: justify; }
  .hero { position: relative; height: 640px; margin-top: 24px; background: #4a463f; }
  .shade { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.0), rgba(0,0,0,0.6)); }
  .chip { display: inline-block; width: 24px; height: 24px; background: #2b6cb0; filter: blur(48px); }
</style>
</head>
<body>
  <h1>작은 팀을 위한 출판 도구</h1>
  <div class="menu"><a href="#a">고객지원센터안내</a><a class="just" href="#b">자주묻는질문모음</a></div>
  <div class="hero"><div class="shade"></div></div>
  <p style="margin: 24px 48px"><span class="chip"></span> 원고를 쓰고 교정하고 책으로 내는 과정을 한곳에서 관리합니다.</p>
</body>
</html>
