<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion done with care</title>
<style>
:root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --dur-press: 160ms; --dur-dropdown: 200ms; }
body { margin: 0; padding: 24px 16px; background: #fbfaf8; color: #1a1a1a; font-family: Georgia, serif; font-size: 16px; line-height: 1.7; }
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 28px; line-height: 1.3; margin: 0 0 12px; font-weight: 600; }
button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #1a1a1a; color: #ffffff; font: inherit;
  transition-property: transform, background-color; transition-duration: var(--dur-press); transition-timing-function: var(--ease-out); }
button:active { transform: scale(0.97); }
.note { margin-top: 16px; padding: 12px 16px; border: 1px solid #d9d5cf; border-radius: 8px;
  animation: enter var(--dur-dropdown) var(--ease-out) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px) scale(0.95); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  button:active { transform: none; }
  .note { animation-name: fade; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>
</head>
<body>
<main>
  <h1>Export the weekly report</h1>
  <p>The file has every source and the date each number was taken.</p>
  <button type="button">Download</button>
  <p class="note">Your report is ready.</p>
</main>
</body>
</html>
