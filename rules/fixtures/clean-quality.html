<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>품질 규칙을 지킨 예시</title>
<style>
body { margin: 0; padding: 24px 16px; background: #fbfaf8; color: #1a1a1a; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 16px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 36px; line-height: 1.3; margin: 0 0 12px; font-weight: 600; }
.card { display: block; min-height: 44px; padding: 12px 16px; background: #efebe5; border-radius: 8px; color: #1a1a1a; text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .card:hover { transform: translateY(-2px); } }
.photo { display: block; width: 100%; height: auto; margin: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>두 줄로 나뉜 큰 한글 제목은<br>줄 간격을 넉넉히 둡니다</h1>
  <p>상태: 아직 답이 없습니다. 첫 화면의 글은 처음부터 보입니다.</p>
  <a class="card" href="#plan">요금제 보기</a>
  <img class="photo" alt="매장 사진" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAIAAAA7ljmRAAAAEUlEQVR4nGM4ceIIHDHg5AAAIT0b8Xt9Vq0AAAAASUVORK5CYII=">
</main>
</body>
</html>
