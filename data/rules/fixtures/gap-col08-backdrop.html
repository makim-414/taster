<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop sample</title>
<style>
/* A record of what COL-08 cannot measure. The caption is pale gray on a translucent blurred panel over an image,
   so it is hard to read, but the color under it comes from the image and the blur, which detect.js cannot sample.
   COL-08 reports nothing here today. When it learns to measure this, make this fixture a positive one. */
@font-face { font-family: "Fixture Sans"; src: local("Helvetica Neue"), local("Arial"), local("Helvetica"), local("DejaVu Sans"); }
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #1a1a1a; font-family: "Fixture Sans", sans-serif; font-size: 17px; line-height: 1.6; }
main { max-width: 880px; margin: 0 auto; padding: 72px 24px; }
h1 { font-size: 40px; line-height: 1.2; margin: 0 0 20px; }
p { margin: 0 0 16px; max-width: 36em; color: #55575a; }
.scene { padding: 64px 24px; background-color: #ffffff; background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='40'%3E%3Crect width='40' height='40' fill='%23f1f1ee'/%3E%3Crect width='20' height='20' fill='%23e9e9e5'/%3E%3C/svg%3E"); }
.panel { max-width: 520px; padding: 24px; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(12px); border-radius: 8px; }
.panel p { color: #c4c4c0; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Plan the week in one place</h1>
  <p>Write the plan, share it with the team and keep the notes next to the work they describe.</p>
  <div class="scene">
    <div class="panel"><p id="gap-caption">Every change is kept, so the history of a decision is one click away.</p></div>
  </div>
</main>
</body>
</html>
