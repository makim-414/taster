<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status dots in the page's own meaning colors</title>
<style>
  /* The page declares its own success and failure tokens. Flat, still dots in those colors are a real outcome
     said in the brand's palette, which AC-08 allows. */
  :root { --success: #1f7a4d; --danger: #b42318; --text: #1a1a1a; --muted: #5b5b5b; }
  body { margin: 0; padding: 48px; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--text); background: #fbfaf8; font-size: 16px; line-height: 1.6; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #e4e2dd; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ok { background: var(--success); }
  .fail { background: var(--danger); }
  .name { flex: 1; }
  .state { color: var(--muted); }
</style>
</head>
<body>
  <h1>Deploys today</h1>
  <ul>
    <li><span class="name">Checkout service</span><span class="dot ok"></span><span class="state">Healthy</span></li>
    <li><span class="name">Search index</span><span class="dot fail"></span><span class="state">Failed at 14:02</span></li>
    <li><span class="name">Mail queue</span><span class="state">Paused</span></li>
  </ul>
</body>
</html>
