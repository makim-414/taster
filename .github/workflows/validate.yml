name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Actions are pinned to a commit; the comment is the release it is. Dependabot moves both (.github/dependabot.yml).
# Every job and every install step has a time limit, so a stalled download fails in minutes instead of holding the run.
# node scripts/gates.mjs runs the same gates locally, in this order; scripts/gates.test.mjs keeps the two in step.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the commit email check can read the commits a pull request adds.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/registry/package-lock.json
      - name: Generated docs are current
        run: |
          node scripts/build-docs.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "node scripts/build-docs.mjs changed the files above. Run it and commit what it writes."
            exit 1
          fi
      - name: Repository data and skill bundle
        run: node scripts/validate.mjs
      - name: Strict taxonomy, negative controls and balance sweep
        run: node scripts/check-taxonomy.mjs
      - name: Weighting axes
        run: node --test data/taxonomy/axes.test.mjs
      - name: Rule schema matches the detector
        run: node packages/engine/scripts/check-rules.mjs
      - name: Install the registry
        timeout-minutes: 8
        run: timeout 240 npm ci --prefix packages/registry --prefer-offline --no-audit --no-fund || timeout 240 npm ci --prefix packages/registry --prefer-offline --no-audit --no-fund
      - name: Registry typecheck
        run: npm --prefix packages/registry run typecheck
      - name: Source lint finds its own bad lines, and the registry stays at or under its baseline
        run: |
          node packages/engine/lint.mjs --selftest
          node packages/engine/lint.mjs packages/registry/src --baseline packages/registry/lint-baseline.json
      - name: Gate scripts
        run: node --test scripts/check-authors.test.mjs scripts/gates.test.mjs
      - name: Commit emails on this pull request are GitHub noreply addresses
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/check-authors.mjs "$RANGE"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/engine/package-lock.json
            packages/registry/package-lock.json
      - name: Install the engine and the registry
        timeout-minutes: 8
        run: |
          for dir in packages/engine packages/registry; do
            timeout 240 npm ci --prefix "$dir" --prefer-offline --no-audit --no-fund || timeout 240 npm ci --prefix "$dir" --prefer-offline --no-audit --no-fund
          done
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "[...new Set(['packages/engine', 'packages/registry'].map((d) => require('./' + d + '/package-lock.json').packages['node_modules/playwright-core'].version))].join('-')")" >> "$GITHUB_OUTPUT"
      - name: Chromium from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Ubuntu runners have no Korean, Japanese, Chinese or Thai fonts, and the apt mirror can take minutes for each
      # font package. The font files install-deps adds are kept here, so a cache hit skips apt.
      - name: Korean, Japanese, Chinese and Thai fonts from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/fonts/ci
          key: ci-fonts-${{ runner.os }}-v1
      - name: Chromium, and its system libraries and fonts only when the runner lacks them
        timeout-minutes: 12
        run: |
          fc-cache -f > /dev/null 2>&1 || true
          npx --prefix packages/engine playwright install chromium
          npx --prefix packages/registry playwright-core install chromium
          if ! (node -e "require('./packages/engine/node_modules/playwright').chromium.launch().then((b) => b.close())" && for l in ko ja zh th; do fc-list ":lang=$l" | grep -q . || exit 1; done); then
            npx --prefix packages/engine playwright install-deps chromium
            mkdir -p ~/.local/share/fonts/ci
            for p in fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf fonts-unifont; do dpkg -L "$p" 2>/dev/null; done | grep -E '\.(ttf|otf|ttc)$' | xargs -r cp -t ~/.local/share/fonts/ci/
          fi
      - name: Detector fixtures
        run: node data/rules/test-detect.mjs
      - name: Engine CLI and MCP
        run: npm --prefix packages/engine test
      - name: Rebuild example stays clean and keeps its content
        run: node packages/engine/scripts/check-rebuild-example.mjs
      - name: Icon slot variations match the taxonomy and stay clean
        run: node packages/engine/scripts/check-icon-slots-example.mjs
      - name: Every component renders at 1440 and 390 with no page or console error
        run: npm --prefix packages/registry run test-render
      - name: Component keyboard focus, accessible names and reduced motion
        run: node packages/registry/test-a11y.mjs
      - name: No component runs what its props hold
        run: node packages/registry/test-injection.mjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/engine/package-lock.json
      - name: Install the web app and the engine
        timeout-minutes: 8
        run: |
          timeout 240 npm ci --prefix apps/web --prefer-offline --no-audit --no-fund || timeout 240 npm ci --prefix apps/web --prefer-offline --no-audit --no-fund
          timeout 240 npm ci --prefix packages/engine --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund || timeout 240 npm ci --prefix packages/engine --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "[...new Set(['packages/engine', 'apps/web'].map((d) => require('./' + d + '/package-lock.json').packages['node_modules/playwright-core'].version))].join('-')")" >> "$GITHUB_OUTPUT"
      - name: Chromium from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Ubuntu runners have no Korean, Japanese, Chinese or Thai fonts, and the apt mirror can take minutes for each
      # font package. The font files install-deps adds are kept here, so a cache hit skips apt.
      - name: Korean, Japanese, Chinese and Thai fonts from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/fonts/ci
          key: ci-fonts-${{ runner.os }}-v1
      - name: Chromium, and its system libraries and fonts only when the runner lacks them
        timeout-minutes: 12
        run: |
          fc-cache -f > /dev/null 2>&1 || true
          npx --prefix apps/web playwright-core install chromium
          if ! (node -e "require('./apps/web/node_modules/playwright-core').chromium.launch().then((b) => b.close())" && for l in ko ja zh th; do fc-list ":lang=$l" | grep -q . || exit 1; done); then
            npx --prefix apps/web playwright-core install-deps chromium
            mkdir -p ~/.local/share/fonts/ci
            for p in fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf fonts-unifont; do dpkg -L "$p" 2>/dev/null; done | grep -E '\.(ttf|otf|ttc)$' | xargs -r cp -t ~/.local/share/fonts/ci/
          fi
      - name: Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/lib/**', 'apps/web/next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
      # next build type-checks the whole project (apps/web/tsconfig.json), the same files
      # npm --prefix apps/web run typecheck reads.
      - name: Typecheck and build
        run: npm --prefix apps/web run build
      - name: Routes trace the engine files they read at run time
        run: node apps/web/scripts/check-traces.mjs
      - name: Address guard, limits and fenced engine on the fixtures
        run: npm --prefix apps/web test
      - name: Serve the build
        run: |
          npm --prefix apps/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3240/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3240/ | grep -q 'id="target"' || { cat "$RUNNER_TEMP/web.log"; echo "web did not start"; exit 1; }
      - name: Zero findings on every page at 1440, 1280 and 390
        run: node apps/web/scripts/self-check.mjs
      - name: The gallery works on a phone, a tablet and a desktop
        run: node apps/web/scripts/check-gallery.mjs
      - name: The tone page works on a phone, a tablet and a desktop
        run: node apps/web/scripts/check-tone.mjs
      - name: Head tags, the 404 screen and the headers hold
        run: node apps/web/scripts/check-metadata.mjs
      - name: Pages stay at or under the accessibility baseline (axe, keyboard focus, reduced motion)
        run: node apps/web/scripts/check-a11y.mjs
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run this repository's action on the rebuild example
        id: taster
        uses: ./
        with:
          targets: |
            examples/rebuild/before.html
            examples/rebuild/after.html
          fail-on: none
          upload-sarif: 'false'
          sarif-file: taster.sarif
      - name: The SARIF has findings for before.html and none for after.html
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("${{ steps.taster.outputs.sarif-file }}", "utf8"));
            const r = s.runs[0].results;
            const before = r.filter((x) => x.locations[0].physicalLocation.artifactLocation.uri === "examples/rebuild/before.html").length;
            const after = r.filter((x) => x.locations[0].physicalLocation.artifactLocation.uri === "examples/rebuild/after.html").length;
            console.log({ before, after });
            if (s.version !== "2.1.0" || before < 10 || after !== 0) process.exit(1);
          '
