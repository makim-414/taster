name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository data and skill bundle
        run: node scripts/validate.mjs
      - name: Rule schema matches the detector
        run: node engine/scripts/check-rules.mjs
      - name: Registry typecheck
        run: |
          npm ci --prefix registry
          npm --prefix registry run typecheck
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install engine and Chromium
        run: |
          npm ci --prefix engine
          npx --prefix engine playwright install --with-deps chromium
      - name: Detector fixtures
        run: node rules/test-detect.mjs
      - name: Engine CLI and MCP
        run: npm --prefix engine test
      - name: Rebuild example stays clean and keeps its content
        run: node engine/scripts/check-rebuild-example.mjs
      - name: Icon slot variations match the taxonomy and stay clean
        run: node engine/scripts/check-icon-slots-example.mjs
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web, engine and Chromium
        run: |
          npm ci --prefix web
          npm ci --prefix engine --omit=dev --ignore-scripts
          npx --prefix web playwright-core install --with-deps chromium
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Build
        run: npm --prefix web run build
      - name: Routes trace the engine files they read at run time
        run: node web/scripts/check-traces.mjs
      - name: Address guard, limits and fenced engine on the fixtures
        run: npm --prefix web test
      - name: The page itself has zero findings at 1440 and 390
        run: |
          npm --prefix web start &
          for i in $(seq 1 30); do curl -sf http://localhost:3240 > /dev/null && break; sleep 2; done
          node web/scripts/self-check.mjs
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this repository's action on the rebuild example
        id: taster
        uses: ./
        with:
          targets: |
            examples/rebuild/before.html
            examples/rebuild/after.html
          fail-on: none
          upload-sarif: 'false'
          sarif-file: taster.sarif
      - name: The SARIF has findings for before.html and none for after.html
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("${{ steps.taster.outputs.sarif-file }}", "utf8"));
            const r = s.runs[0].results;
            const before = r.filter((x) => x.locations[0].physicalLocation.artifactLocation.uri === "examples/rebuild/before.html").length;
            const after = r.filter((x) => x.locations[0].physicalLocation.artifactLocation.uri === "examples/rebuild/after.html").length;
            console.log({ before, after });
            if (s.version !== "2.1.0" || before < 10 || after !== 0) process.exit(1);
          '
