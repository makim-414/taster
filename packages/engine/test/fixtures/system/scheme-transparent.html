<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docs on the white canvas</title>
<style>
  /* No background on html or body: the browser paints its default canvas, which is white. */
  body { margin: 0; padding: 48px; font-family: Georgia, serif; color: #1a1a1a; }
  .button { display: inline-block; padding: 8px 16px; background: #1d4ed8; color: #ffffff; text-decoration: none; }
</style>
</head>
<body>
  <header><a href="/">Ledgerline</a></header>
  <h1>Read the guide</h1>
  <p>Every page of the guide sits on the plain canvas.</p>
  <a class="button" href="#start">Start reading</a>
</body>
</html>
