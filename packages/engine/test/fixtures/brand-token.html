<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand token over accent</title>
<!-- A landing whose brand is a dark green token, used on the logo mark, highlights and the focus ring, next to a lime
     accent that fills more buttons. The brand color must be the green token, not the lime the buttons use most. -->
<style>
  @layer theme {
    :root {
      --color-ink: #0e1a17;
      --color-canvas: #fbfaf7;
      --color-brand: #0f6b4f;
      --color-brand-soft: #e4f1eb;
      --color-accent: #c8f169;
    }
  }
  @layer base {
    body { margin: 0; font: 16px/1.5 Georgia, serif; color: var(--color-ink); background: var(--color-canvas); }
    :focus-visible { outline: 2px solid; outline-color: var(--color-brand); outline-offset: 2px; }
  }
  header a { color: inherit; text-decoration: none; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; }
  .mark rect { fill: var(--color-brand); }
  .mark path { stroke: var(--color-accent); }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none; background: var(--color-accent); color: var(--color-ink); }
  .btn-brand { background: var(--color-brand); color: #fff; }
  .hl { color: var(--color-brand); }
  .num { color: var(--color-accent); background: var(--color-ink); padding: 0 4px; }
</style>
</head>
<body>
<header>
  <a href="#top" aria-label="Ledger home"><svg class="mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8"></rect><path d="M8 8v12h12" stroke-width="2.5" fill="none"></path></svg> <span>Ledger</span></a>
  <nav><a href="#features">Features</a> <a href="#pricing">Pricing</a></nav>
  <a class="btn" href="#start">Get started</a>
</header>
<main>
  <section>
    <h1>Close the month in <span class="hl">two days</span></h1>
    <p>Reconcile every account without the spreadsheet.</p>
    <a class="btn" href="#start">Start free</a> <a class="btn" href="#demo">Book a demo</a> <a class="btn-brand btn" href="#tour">Take the tour</a>
  </section>
  <section>
    <h2>Numbers that add up</h2>
    <p><span class="num">98%</span> matched automatically, <span class="num">4x</span> faster.</p>
    <a class="btn" href="#calc">See the math</a> <a class="btn" href="#cases">Read the stories</a>
  </section>
  <section id="pricing">
    <h2>Pricing</h2>
    <a class="btn" href="#team">Choose Team</a> <a class="btn" href="#growth">Choose Growth</a>
  </section>
</main>
</body>
</html>
